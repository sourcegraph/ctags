name: run units target on MSYS2

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  testing:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        msystem: [MINGW32, MINGW64, CLANG64]

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      with:
        msystem: ${{ matrix.msystem }}
        update: true
        install: automake autoconf make dos2unix pkg-config
        pacboy: toolchain:p python-sphinx:p libxml2:p libyaml:p pcre2:p

    - run: |
        pacman -Sy --noconfirm --needed ${MINGW_PACKAGE_PREFIX}-jansson || :

    - run: git config --global core.autocrlf input
      shell: bash

    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - run: ./autogen.sh
    - run: ./configure --prefix=/usr
    - run: make V=1
    - run: make install
    - run: file /usr/bin/ctags
    - run: ctags --version

    - run: make check V=1

    # FAILED: "./readtags.exe" -t "/d/a/ctags2/ctags2/Units/parser-asciidoc.r/utf8-asciidoc.d/expected.tags" - "@Ѐ–𐀀"
    # The raw tag name was "@Ѐ–𐀀"
    #- run: make roundtrip

    - run: make tmain
    - run: make units
